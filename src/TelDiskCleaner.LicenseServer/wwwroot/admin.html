<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TelDiskCleaner licences</title>
<style>
:root { --ink:#0F172A; --muted:#475569; --line:#E2E8F0; --brand:#2563D2; --bad:#B91C1C; --ok:#15803D; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, Segoe UI, sans-serif; color: var(--ink); background: #F8FAFC; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { margin: 0 0 4px; font-size: 24px; }
p.sub { margin: 0 0 20px; color: var(--muted); }
section { background: #FFF; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
h2 { margin: 0 0 12px; font-size: 17px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
input { font: inherit; padding: 8px 10px; border: 1px solid #CBD5E1; border-radius: 8px; color: var(--ink); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.row label { flex: 1 1 160px; }
button { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--brand); background: var(--brand); color: #FFF; cursor: pointer; }
button.ghost { background: #FFF; color: var(--brand); }
button.danger { border-color: var(--bad); background: #FFF; color: var(--bad); }
#newKey { margin-top: 12px; font: 600 20px ui-monospace, Consolas, monospace; display: none; }
#message { min-height: 20px; font-weight: 600; margin: 8px 0 0; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
td.key { font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
td.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.badge.active { background: #DCFCE7; color: var(--ok); }
.badge.expired, .badge.revoked { background: #FEE2E2; color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>TelDiskCleaner licences</h1>
  <p class="sub">Create a key after a customer pays, then send it to them. Each key works on the number of PCs you set for one year (or the months you choose).</p>

  <section>
    <h2>Admin key</h2>
    <div class="row">
      <label>Admin key (from the server's Admin:ApiKey setting)
        <input id="adminKey" type="password" autocomplete="off">
      </label>
      <button id="load" type="button">Load licences</button>
    </div>
  </section>

  <section>
    <h2>Create a licence</h2>
    <form id="create" class="row">
      <label>Customer name <input name="customerName" required></label>
      <label>Phone or email <input name="contact"></label>
      <label style="flex:0 1 110px">Months <input name="months" type="number" min="1" max="120" value="12"></label>
      <label style="flex:0 1 110px">PCs <input name="maxDevices" type="number" min="1" max="1000" value="1"></label>
      <button type="submit">Create key</button>
    </form>
    <div id="newKey"></div>
    <p id="message" role="status"></p>
  </section>

  <section>
    <h2>Licences</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Key</th><th>Customer</th><th>Status</th><th>Expires</th><th>PCs in use</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const keyInput = document.getElementById('adminKey');
const message = document.getElementById('message');
const rows = document.getElementById('rows');
const newKey = document.getElementById('newKey');

try { keyInput.value = sessionStorage.getItem('tdc-admin-key') || ''; } catch (e) {}

async function call(method, url, body) {
  try { sessionStorage.setItem('tdc-admin-key', keyInput.value); } catch (e) {}
  const response = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': keyInput.value },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (response.status === 401) throw new Error('Wrong admin key.');
  if (!response.ok) {
    const text = await response.text();
    throw new Error(text || ('Request failed: ' + response.status));
  }
  return response.status === 204 ? null : response.json();
}

function show(text, ok) {
  message.textContent = text;
  message.style.color = ok ? 'var(--ok)' : 'var(--bad)';
}

function cell(text, className) {
  const td = document.createElement('td');
  if (className) td.className = className;
  td.textContent = text;
  return td;
}

function button(text, style, handler) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = text;
  if (style) b.className = style;
  b.addEventListener('click', handler);
  return b;
}

function render(licenses) {
  rows.replaceChildren();
  const now = new Date();
  for (const l of licenses) {
    const tr = document.createElement('tr');
    const expires = new Date(l.expiresUtc);
    const status = l.revoked ? 'revoked' : (expires <= now ? 'expired' : 'active');

    tr.append(cell(l.key, 'key'));
    tr.append(cell(l.customerName + (l.contact ? ' · ' + l.contact : '')));
    const statusTd = document.createElement('td');
    const badge = document.createElement('span');
    badge.className = 'badge ' + status;
    badge.textContent = status;
    statusTd.append(badge);
    tr.append(statusTd);
    tr.append(cell(expires.toLocaleDateString()));
    tr.append(cell(l.devices.length + ' of ' + l.maxDevices + (l.devices.length ? ': ' + l.devices.map(d => d.machineName).join(', ') : '')));

    const actions = document.createElement('td');
    actions.className = 'actions';
    actions.append(
      button('Copy key', 'ghost', () => navigator.clipboard.writeText(l.key).then(() => show('Copied ' + l.key, true))),
      button('Renew 12 months', 'ghost', () => act('renew', l.key, { months: 12 }, 'Renewed ' + l.key)),
      button('Reset PCs', 'ghost', () => {
        if (confirm('Free up all PCs on ' + l.key + '? The customer can then activate it on a new PC.')) act('reset-devices', l.key, null, 'PCs reset for ' + l.key);
      }),
      button('Revoke', 'danger', () => {
        if (confirm('Cancel ' + l.key + '? Pro stops working for this customer.')) act('revoke', l.key, null, 'Revoked ' + l.key);
      }));
    tr.append(actions);
    rows.append(tr);
  }
}

async function load() {
  try {
    render(await call('GET', '/api/admin/licenses'));
  } catch (e) {
    show(e.message, false);
  }
}

async function act(action, key, body, done) {
  try {
    await call('POST', '/api/admin/licenses/' + encodeURIComponent(key) + '/' + action, body);
    show(done, true);
    await load();
  } catch (e) {
    show(e.message, false);
  }
}

document.getElementById('load').addEventListener('click', load);

document.getElementById('create').addEventListener('submit', async (event) => {
  event.preventDefault();
  const form = new FormData(event.target);
  try {
    const created = await call('POST', '/api/admin/licenses', {
      customerName: form.get('customerName'),
      contact: form.get('contact'),
      months: Number(form.get('months')),
      maxDevices: Number(form.get('maxDevices')),
    });
    newKey.textContent = created.key;
    newKey.style.display = 'block';
    show('Key created. Send it to ' + created.customerName + '.', true);
    event.target.reset();
    await load();
  } catch (e) {
    show(e.message, false);
  }
});
</script>
</body>
</html>
